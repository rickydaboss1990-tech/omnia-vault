<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Omnia Vault — everything your project knows, everything it can do">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1a2348"/>
      <stop offset="50%" stop-color="#0f152e"/>
      <stop offset="100%" stop-color="#090d1d"/>
    </radialGradient>
    <linearGradient id="wm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="35%" stop-color="#c4b5fd"/>
      <stop offset="70%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="gemEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="gemFill" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#232c55"/>
      <stop offset="100%" stop-color="#0c1129"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- inflow paths: pillars -> the vault -->
    <path id="pMem"   d="M 300,300 C 380,240 480,190 566,142" fill="none"/>
    <path id="pPlan"  d="M 600,298 C 600,250 600,205 600,172" fill="none"/>
    <path id="pTools" d="M 900,300 C 820,240 720,190 634,142" fill="none"/>
    <path id="pClaude" d="M 158,186 C 300,150 450,122 549,106" fill="none"/>
    <path id="pCodex"  d="M 1042,186 C 900,150 750,122 651,106" fill="none"/>
    <!-- the relay arc between the two agents, over the vault -->
    <path id="pRelay" d="M 150,158 C 330,18 870,18 1050,158" fill="none"/>
    <style>
      .edge { stroke: #33406b; stroke-width: 1.2; fill: none; stroke-dasharray: 460; stroke-dashoffset: 460; animation: draw 2.2s ease-out forwards; }
      .edge.d2 { animation-delay: .3s; } .edge.d3 { animation-delay: .6s; } .edge.d4 { animation-delay: .9s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .node { animation: pulse 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node.p2 { animation-delay: 1.1s; } .node.p3 { animation-delay: 2.2s; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.4); opacity: 1; } }
      .star { animation: twinkle 5s ease-in-out infinite; }
      .star.t2 { animation-delay: 1.7s; } .star.t3 { animation-delay: 3.4s; }
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .7; } }
      .fadeup { opacity: 0; animation: fadeup 1s ease-out forwards; }
      .fadeup.f2 { animation-delay: .45s; } .fadeup.f3 { animation-delay: .85s; } .fadeup.f4 { animation-delay: 1.2s; }
      @keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .gem { animation: breathe 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
      .stream { stroke: #2b3663; stroke-width: 1; fill: none; stroke-dasharray: 2 6; opacity: .8; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="398" rx="13" fill="none" stroke="#2a355e" stroke-width="1.5"/>

  <!-- star field -->
  <g fill="#8ea2d8">
    <circle class="star"    cx="80"   cy="52"  r="1.4"/>
    <circle class="star t2" cx="245"  cy="90"  r="1.1"/>
    <circle class="star t3" cx="420"  cy="44"  r="1.3"/>
    <circle class="star t2" cx="782"  cy="46"  r="1.3"/>
    <circle class="star"    cx="958"  cy="88"  r="1.1"/>
    <circle class="star t3" cx="1122" cy="54"  r="1.4"/>
    <circle class="star"    cx="72"   cy="340" r="1.2"/>
    <circle class="star t3" cx="1130" cy="338" r="1.2"/>
    <circle class="star t2" cx="480"  cy="368" r="1.0"/>
    <circle class="star"    cx="720"  cy="366" r="1.0"/>
  </g>

  <!-- inflow guides (faint) -->
  <use href="#pMem" class="stream"/>
  <use href="#pPlan" class="stream"/>
  <use href="#pTools" class="stream"/>
  <use href="#pClaude" class="stream"/>
  <use href="#pCodex" class="stream"/>
  <use href="#pRelay" stroke="#3b4a7d" stroke-width="1" stroke-dasharray="3 7" fill="none" opacity="0.8"/>

  <!-- THE VAULT: rotating orbit + faceted obsidian gem -->
  <g>
    <g opacity="0.4">
      <circle cx="600" cy="108" r="86" fill="none" stroke="#4c5a95" stroke-width="1" stroke-dasharray="3 11">
        <animateTransform attributeName="transform" type="rotate" from="0 600 108" to="360 600 108" dur="46s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g class="gem" filter="url(#soft)">
      <polygon points="600,52 649,80 649,136 600,164 551,136 551,80" fill="url(#gemFill)" stroke="url(#gemEdge)" stroke-width="2.2"/>
      <polygon points="600,74 630,91 630,125 600,142 570,125 570,91" fill="none" stroke="#5b6bab" stroke-width="1"/>
      <path d="M 600,52 L 600,74 M 649,80 L 630,91 M 649,136 L 630,125 M 600,164 L 600,142 M 551,136 L 570,125 M 551,80 L 570,91" stroke="#5b6bab" stroke-width="1"/>
      <!-- the graph inside the vault -->
      <path d="M 585,100 L 612,94 M 612,94 L 618,118 M 585,100 L 596,124 M 596,124 L 618,118" stroke="#7d8fd0" stroke-width="1"/>
      <circle class="node"    cx="585" cy="100" r="3.4" fill="#c4b5fd"/>
      <circle class="node p2" cx="612" cy="94"  r="2.8" fill="#7dd3fc"/>
      <circle class="node p3" cx="618" cy="118" r="2.8" fill="#86efac"/>
      <circle class="node p2" cx="596" cy="124" r="2.6" fill="#f9a8d4"/>
    </g>
  </g>

  <!-- agent constellations -->
  <g>
    <path class="edge"    d="M 148,186 L 84,148 M 148,186 L 72,208 M 148,186 L 118,262"/>
    <path class="edge d2" d="M 84,148 L 72,208 M 118,262 L 72,208"/>
    <circle class="node"    cx="148" cy="186" r="8.5" fill="#7dd3fc" filter="url(#soft)"/>
    <circle class="node p2" cx="84"  cy="148" r="4.2" fill="#7dd3fc"/>
    <circle class="node p3" cx="72"  cy="208" r="5"   fill="#38bdf8"/>
    <circle class="node p2" cx="118" cy="262" r="3.8" fill="#7dd3fc"/>
    <text x="121" y="296" text-anchor="middle" fill="#7dd3fc" font-size="14.5" font-weight="700" letter-spacing="2.5">CLAUDE CODE</text>
  </g>
  <g>
    <path class="edge"    d="M 1052,186 L 1116,148 M 1052,186 L 1128,208 M 1052,186 L 1082,262"/>
    <path class="edge d2" d="M 1116,148 L 1128,208 M 1082,262 L 1128,208"/>
    <circle class="node p3" cx="1052" cy="186" r="8.5" fill="#86efac" filter="url(#soft)"/>
    <circle class="node"    cx="1116" cy="148" r="4.2" fill="#86efac"/>
    <circle class="node p2" cx="1128" cy="208" r="5"   fill="#4ade80"/>
    <circle class="node p3" cx="1082" cy="262" r="3.8" fill="#86efac"/>
    <text x="1079" y="296" text-anchor="middle" fill="#86efac" font-size="14.5" font-weight="700" letter-spacing="2.5">CODEX</text>
  </g>

  <!-- the relay baton -->
  <circle r="5" fill="#fbbf24" filter="url(#glowStrong)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1;0;0" keyTimes="0;0.44;0.5;0.94;1" calcMode="linear">
      <mpath href="#pRelay"/>
    </animateMotion>
  </circle>

  <!-- capability pillars -->
  <g text-anchor="middle">
    <g>
      <path class="edge d3" d="M 300,300 L 262,326 M 300,300 L 338,328 M 262,326 L 338,328"/>
      <circle class="node"    cx="300" cy="300" r="6.5" fill="#c4b5fd" filter="url(#soft)"/>
      <circle class="node p2" cx="262" cy="326" r="3.4" fill="#a78bfa"/>
      <circle class="node p3" cx="338" cy="328" r="3.4" fill="#c4b5fd"/>
      <text class="fadeup f2" x="300" y="356" fill="#c4b5fd" font-size="17" font-weight="700" letter-spacing="3">MEMORY</text>
      <text class="fadeup f3" x="300" y="376" fill="#7c89b8" font-size="11.5" letter-spacing="1">llm wiki &#183; code graphs &#183; chat archive</text>
    </g>
    <g>
      <path class="edge d3" d="M 600,298 L 562,326 M 600,298 L 638,326 M 562,326 L 638,326"/>
      <circle class="node p2" cx="600" cy="298" r="6.5" fill="#fbbf24" filter="url(#soft)"/>
      <circle class="node"    cx="562" cy="326" r="3.4" fill="#f59e0b"/>
      <circle class="node p3" cx="638" cy="326" r="3.4" fill="#fbbf24"/>
      <text class="fadeup f2" x="600" y="356" fill="#fbbf24" font-size="17" font-weight="700" letter-spacing="3">PLANNING</text>
      <text class="fadeup f3" x="600" y="376" fill="#7c89b8" font-size="11.5" letter-spacing="1">war-room &#183; video intel &#183; living roadmap</text>
    </g>
    <g>
      <path class="edge d3" d="M 900,300 L 862,328 M 900,300 L 938,326 M 862,328 L 938,326"/>
      <circle class="node p3" cx="900" cy="300" r="6.5" fill="#f9a8d4" filter="url(#soft)"/>
      <circle class="node p2" cx="862" cy="328" r="3.4" fill="#fb7185"/>
      <circle class="node"    cx="938" cy="326" r="3.4" fill="#f9a8d4"/>
      <text class="fadeup f2" x="900" y="356" fill="#f9a8d4" font-size="17" font-weight="700" letter-spacing="3">TOOLS</text>
      <text class="fadeup f3" x="900" y="376" fill="#7c89b8" font-size="11.5" letter-spacing="1">21 skills &#183; installers &#183; design &amp; docs stack</text>
    </g>
  </g>

  <!-- motes flowing INTO the vault -->
  <g>
    <circle r="2.6" fill="#c4b5fd" filter="url(#soft)"><animateMotion dur="3.6s" begin="0s"    repeatCount="indefinite"><mpath href="#pMem"/></animateMotion></circle>
    <circle r="2"   fill="#c4b5fd"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#pMem"/></animateMotion></circle>
    <circle r="2.6" fill="#fbbf24" filter="url(#soft)"><animateMotion dur="3.2s" begin="0.9s"  repeatCount="indefinite"><mpath href="#pPlan"/></animateMotion></circle>
    <circle r="2"   fill="#fbbf24"><animateMotion dur="3.2s" begin="2.5s" repeatCount="indefinite"><mpath href="#pPlan"/></animateMotion></circle>
    <circle r="2.6" fill="#f9a8d4" filter="url(#soft)"><animateMotion dur="3.6s" begin="0.4s"  repeatCount="indefinite"><mpath href="#pTools"/></animateMotion></circle>
    <circle r="2"   fill="#f9a8d4"><animateMotion dur="3.6s" begin="2.2s" repeatCount="indefinite"><mpath href="#pTools"/></animateMotion></circle>
    <circle r="2.4" fill="#7dd3fc"><animateMotion dur="4.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#pClaude"/></animateMotion></circle>
    <circle r="2.4" fill="#86efac"><animateMotion dur="4.4s" begin="3.1s" repeatCount="indefinite"><mpath href="#pCodex"/></animateMotion></circle>
  </g>

  <!-- wordmark -->
  <g text-anchor="middle">
    <text class="fadeup" x="600" y="234" font-size="58" font-weight="800" letter-spacing="12" fill="url(#wm)" filter="url(#soft)">OMNIA VAULT</text>
    <text class="fadeup f2" x="600" y="268" font-size="16.5" fill="#aab6dd" letter-spacing="1.4">Everything your project knows. Everything it can do.</text>
  </g>
</svg>
